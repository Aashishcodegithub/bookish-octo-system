services:
  fraud-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud_detection_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Fraud Detection API
      - ENVIRONMENT=production
      - DEBUG=false
      - JWT_SECRET_KEY=super-secret-enterprise-fraud-detection-jwt-key-change-in-prod
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
